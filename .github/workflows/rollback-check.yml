name: Rollback qualification

on:
  workflow_dispatch:
    inputs:
      current-image:
        description: Immutable image@sha256 reference from the current successful publication.json
        required: true
        type: string
      rollback-image:
        description: Immutable image@sha256 reference from an earlier successful publication.json
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: rollback-qualification
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
  IMAGE_REPOSITORY: ${{ vars.CONTAINER_REPOSITORY || github.repository }}

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify rollback tooling
        run: python -m pytest -q tests/unit/config/test_rollback.py --no-cov
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}
      - name: Exercise retained-image rollback and recovery
        env:
          CURRENT_IMAGE: ${{ inputs.current-image }}
          ROLLBACK_IMAGE: ${{ inputs.rollback-image }}
          SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: python -m scripts.test_rollback --current-image "$CURRENT_IMAGE" --rollback-image "$ROLLBACK_IMAGE" --source "$SOURCE_REPOSITORY"
      - name: Retain rollback evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rollback-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-artifacts/rollback/
          retention-days: 90
          if-no-files-found: error
