name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check formatting
        run: black --check app tests
      - name: Lint
        run: ruff check app tests
      - name: Type check
        run: mypy app
  test-layers:
    needs: static-analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [unit, integration, e2e]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # pytest exits with status 5 if marker selection collects no tests.
      - name: Verify ${{ matrix.layer }} collection is non-empty
        run: pytest --collect-only -q --no-cov -m "${{ matrix.layer }}"
      - name: Run ${{ matrix.layer }} tests
        run: pytest -q --no-cov -m "${{ matrix.layer }}"

  combined-coverage:
    needs: test-layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run combined branch coverage
        run: pytest -q
      - name: Enforce critical package coverage
        run: |
          shopt -s globstar
          coverage report --fail-under=90 app/common/middleware/*.py
          coverage report --fail-under=95 app/common/handlers/lifecycle_handler.py
          coverage report --fail-under=95 app/database/**/*.py
          coverage report --fail-under=95 app/api/**/*.py

  production-container:
    needs: combined-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build production image
        run: docker build --tag quickapi-fastapi:ci .
      - name: Start production image
        run: |
          docker run --detach --name quickapi-fastapi \
            --publish 8000:8000 \
            --env APP_NAME=QuickAPI \
            --env APP_VERSION=1.0.0 \
            --env ENV=production \
            --env LOG_LEVEL=INFO \
            --env HOST=0.0.0.0 \
            --env PORT=8000 \
            --env DATABASE_URL=sqlite+aiosqlite:////tmp/quickapi.db \
            quickapi-fastapi:ci
      - name: Smoke-test built artifact
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/ready; then
              curl --fail --silent http://localhost:8000/api/v1/items/
              exit 0
            fi
            sleep 1
          done
          docker logs quickapi-fastapi
          exit 1
      - name: Print container logs on failure
        if: failure()
        run: docker logs quickapi-fastapi
