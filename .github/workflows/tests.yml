name: Quality

on:
  pull_request:
  push:
    branches: [main, staging, dev]
  merge_group:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Audit pinned runtime and development requirements
        run: python -m scripts.security_scan dependencies
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dependency-security-${{ github.run_attempt }}
          path: |
            test-artifacts/security/dependencies/
            security/dependency-audit-exceptions.json
          retention-days: 14
          if-no-files-found: error

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Check formatting
        run: python -m scripts.format_code --check
      - name: Lint
        run: python -m ruff check app tests scripts
      - name: Type check
        run: python -m mypy app scripts
  test-layers:
    needs: static-analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [unit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      # pytest exits with status 5 if marker selection collects no tests.
      - name: Verify ${{ matrix.layer }} collection is non-empty
        run: python -m pytest --collect-only -q --no-cov -m "${{ matrix.layer }}"
      - name: Run ${{ matrix.layer }} tests
        run: python -m pytest -q --no-cov -m "${{ matrix.layer }}" --junitxml=test-artifacts/unit.xml
      - name: Retain unit test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unit-results-${{ github.run_attempt }}
          path: test-artifacts/unit.xml
          retention-days: 14
          if-no-files-found: error

  mysql-tests:
    needs: static-analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [integration, e2e]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Run migrated disposable MySQL ${{ matrix.layer }} suite
        env:
          PYTEST_ADDOPTS: --junitxml=test-artifacts/mysql-${{ matrix.layer }}.xml
        run: python -m scripts.test_db test --layer "${{ matrix.layer }}" --keep-db
      - name: Verify MySQL TLS transport
        if: matrix.layer == 'integration'
        env:
          PYTEST_ADDOPTS: --junitxml=test-artifacts/mysql-tls.xml
        run: python -m scripts.test_db tls
      - name: Capture MySQL diagnostics on failure
        if: failure()
        run: |
          mkdir -p test-artifacts
          python -m scripts.test_db logs > test-artifacts/mysql.log 2>&1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mysql-${{ matrix.layer }}-results-${{ github.run_attempt }}
          path: |
            test-artifacts/mysql-${{ matrix.layer }}.xml
            test-artifacts/mysql-tls.xml
            test-artifacts/mysql.log
          retention-days: 14
          if-no-files-found: error
      - name: Remove disposable MySQL resources
        if: always()
        run: python -m scripts.test_db down

  combined-coverage:
    needs: [test-layers, mysql-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Run combined branch coverage
        env:
          PYTEST_ADDOPTS: --junitxml=test-artifacts/combined.xml
        run: python -m scripts.test_db test --keep-db
      - name: Enforce critical package coverage
        run: |
          shopt -s globstar
          coverage report --fail-under=90 app/common/middleware/*.py
          coverage report --fail-under=95 app/common/handlers/lifecycle_handler.py
          coverage report --fail-under=95 app/database/**/*.py
          coverage report --fail-under=95 app/api/**/*.py
      - name: Capture MySQL diagnostics on failure
        if: failure()
        run: |
          mkdir -p test-artifacts
          python -m scripts.test_db logs > test-artifacts/mysql-coverage.log 2>&1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: combined-coverage-results-${{ github.run_attempt }}
          path: |
            test-artifacts/combined.xml
            test-artifacts/mysql-coverage.log
            coverage.xml
            .coverage
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Remove disposable coverage database
        if: always()
        run: python -m scripts.test_db down

  production-container:
    needs: combined-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Build production image
        run: docker build --tag quickapi-fastapi:ci .
      - name: Record immutable runtime image
        id: runtime
        run: echo "image=$(docker image inspect --format '{{.Id}}' quickapi-fastapi:ci)" >> "$GITHUB_OUTPUT"
      - name: Qualify built image against disposable MySQL
        run: python -m scripts.test_image --image '${{ steps.runtime.outputs.image }}'
      - name: Scan the exact qualified runtime image
        run: python -m scripts.security_scan image --image '${{ steps.runtime.outputs.image }}'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: runtime-image-security-${{ github.run_attempt }}
          path: |
            test-artifacts/security/image/
            security/container-vulnerability-exceptions.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: production-mysql-diagnostics-${{ github.run_attempt }}
          path: test-artifacts/production-mysql.log
          retention-days: 14
          if-no-files-found: error
      - name: Remove disposable image-qualification resources
        if: always()
        run: python -m scripts.test_image --cleanup

  deployment-gate:
    name: Deployment gate
    if: always()
    needs:
      - dependency-security
      - static-analysis
      - test-layers
      - mysql-tests
      - combined-coverage
      - production-container
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require all validation jobs to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python -m scripts.ci_gate
      - name: Retain aggregate decision
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: deployment-gate-${{ github.run_attempt }}
          path: test-artifacts/ci-gate.json
          retention-days: 14
          if-no-files-found: error
