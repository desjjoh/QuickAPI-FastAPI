name: Quality

on:
  pull_request:
  push:
    branches: [main, staging, dev]
  merge_group:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Check formatting
        run: python -m black --check app tests scripts
      - name: Lint
        run: python -m ruff check app tests scripts
      - name: Type check
        run: python -m mypy app scripts
  test-layers:
    needs: static-analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [unit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      # pytest exits with status 5 if marker selection collects no tests.
      - name: Verify ${{ matrix.layer }} collection is non-empty
        run: python -m pytest --collect-only -q --no-cov -m "${{ matrix.layer }}"
      - name: Run ${{ matrix.layer }} tests
        run: python -m pytest -q --no-cov -m "${{ matrix.layer }}"

  mysql-tests:
    needs: static-analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [integration, e2e]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Run migrated disposable MySQL ${{ matrix.layer }} suite
        run: python -m scripts.test_db test --layer "${{ matrix.layer }}" --keep-db
      - name: Verify MySQL TLS transport
        if: matrix.layer == 'integration'
        run: python -m scripts.test_db tls
      - name: Capture MySQL diagnostics on failure
        if: failure()
        run: |
          mkdir -p test-artifacts
          python -m scripts.test_db logs > test-artifacts/mysql.log 2>&1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mysql-${{ matrix.layer }}-diagnostics
          path: test-artifacts/
      - name: Remove disposable MySQL resources
        if: always()
        run: python -m scripts.test_db down

  combined-coverage:
    needs: [test-layers, mysql-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Run combined branch coverage
        run: python -m scripts.test_db test --keep-db
      - name: Enforce critical package coverage
        run: |
          shopt -s globstar
          coverage report --fail-under=90 app/common/middleware/*.py
          coverage report --fail-under=95 app/common/handlers/lifecycle_handler.py
          coverage report --fail-under=95 app/database/**/*.py
          coverage report --fail-under=95 app/api/**/*.py
      - name: Capture MySQL diagnostics on failure
        if: failure()
        run: |
          mkdir -p test-artifacts
          python -m scripts.test_db logs > test-artifacts/mysql-coverage.log 2>&1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mysql-coverage-diagnostics
          path: test-artifacts/
      - name: Remove disposable coverage database
        if: always()
        run: python -m scripts.test_db down

  production-container:
    needs: combined-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Build production image
        run: docker build --tag quickapi-fastapi:ci .
      - name: Qualify built image against disposable MySQL
        run: python -m scripts.test_image
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-mysql-diagnostics
          path: test-artifacts/
      - name: Remove disposable image-qualification resources
        if: always()
        run: python -m scripts.test_image --cleanup
